<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header"> <!--HEADER-->
        <h1 class="h1">CALCULADORA DE IMC</h1>
    </header>
    <main class="principal"> <!--Area principal do site onte tem o peso, altura, botões e os resultados-->
        <input type="number" name="peso" id="peso" placeholder="Coloque seu peso.">
        <input type="number" name="altura" id="altura" placeholder="Coloque sua altura.">

        <button type="button" id="btn_calcular" class="btn_calcular"><h3>Calcular</h3></button>

        <div class="container"> <!--Div para deixar o MAIN mais organizado-->
            <p class="resultado">IMC</p>
            <p class="classificação">Classificação</p>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
